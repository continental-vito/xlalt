<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="squircle">
      <path d="M512 40 C 838 40 984 186 984 512 C 984 838 838 984 512 984 C 186 984 40 838 40 512 C 40 186 186 40 512 40 Z"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F8A55"/>
      <stop offset="1" stop-color="#0F6A3F"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- faint gridlines: spreadsheet world -->
    <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4">
      <path d="M0 256 H1024 M0 512 H1024 M0 768 H1024"/>
      <path d="M256 0 V1024 M512 0 V1024 M768 0 V1024"/>
    </g>
    <!-- rising chart line behind corgi -->
    <path d="M110 800 L330 640 L520 700 L900 360" fill="none" stroke="#F5C542" stroke-opacity="0.5" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ===== corgi ===== -->
    <!-- ears -->
    <path d="M300 350 L360 130 L470 320 Z" fill="#E8964B"/>
    <path d="M724 350 L664 130 L554 320 Z" fill="#E8964B"/>
    <path d="M328 320 L364 190 L436 312 Z" fill="#F7C79B"/>
    <path d="M696 320 L660 190 L588 312 Z" fill="#F7C79B"/>
    <!-- head -->
    <ellipse cx="512" cy="520" rx="270" ry="245" fill="#E8964B"/>
    <!-- cheeks / muzzle white -->
    <path d="M512 420 C 640 420 700 520 690 620 C 680 720 600 765 512 765 C 424 765 344 720 334 620 C 324 520 384 420 512 420 Z" fill="#FDF6EC"/>
    <!-- forehead blaze -->
    <path d="M512 300 C 545 360 545 430 512 470 C 479 430 479 360 512 300 Z" fill="#FDF6EC"/>
    <!-- glasses -->
    <g fill="none" stroke="#2B2B2B" stroke-width="18">
      <circle cx="405" cy="500" r="78" fill="#BFE3FF" fill-opacity="0.35"/>
      <circle cx="619" cy="500" r="78" fill="#BFE3FF" fill-opacity="0.35"/>
      <path d="M483 500 H541"/>
    </g>
    <!-- eyes -->
    <circle cx="405" cy="505" r="26" fill="#2B2B2B"/>
    <circle cx="619" cy="505" r="26" fill="#2B2B2B"/>
    <circle cx="414" cy="496" r="8" fill="#FFFFFF"/>
    <circle cx="628" cy="496" r="8" fill="#FFFFFF"/>
    <!-- nose + mouth -->
    <path d="M512 585 C 540 585 552 603 546 620 C 540 637 524 645 512 645 C 500 645 484 637 478 620 C 472 603 484 585 512 585 Z" fill="#2B2B2B"/>
    <path d="M512 645 V 680 M512 680 C 500 706 470 710 452 696 M512 680 C 524 706 554 710 572 696" fill="none" stroke="#2B2B2B" stroke-width="12" stroke-linecap="round"/>
    <!-- gold bowtie -->
    <g fill="#F5C542" stroke="#C99A1F" stroke-width="8">
      <path d="M512 806 L400 756 L400 866 Z"/>
      <path d="M512 806 L624 756 L624 866 Z"/>
      <circle cx="512" cy="808" r="26"/>
    </g>
  </g>
</svg>
