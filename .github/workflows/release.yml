name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. v1.4)'
        required: true
permissions:
  contents: write
jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Tests run on every push in the ubuntu 'tests' workflow; this job
      # only builds and ships. (A brew/lua install here proved brittle on
      # the macOS runner and failed the v1.4.1 build.)
      # Everything below is inert until the secrets exist. With no
      # certificate the build signs ad-hoc exactly as it does today, so
      # adding this changes nothing until MACOS_CERT_P12 is set.
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt no one can answer
          # and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
                       | grep "Developer ID Application" | head -1 \
                       | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY"
          echo "XL_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "imported: $IDENTITY"

      - name: Build, sign, and package DMG
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          export XL_VERSION="${TAG#v}"
          export XL_BUILD="${{ github.run_number }}"
          bash build/build-app.sh

      # Notarization is a separate step from signing: Apple has to see the
      # build. Stapling then writes the result into the bundle so it
      # validates offline, which matters because the first launch after a
      # download is exactly when there may be no network.
      - name: Notarize and staple
        if: ${{ env.XL_SIGN_IDENTITY != '' && env.NOTARY_KEY != '' }}
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          submit() {
            xcrun notarytool submit "$1" --wait --timeout 30m \
              --key "$RUNNER_TEMP/key.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          }
          # The zip is what Sparkle and the built-in updater download; the
          # DMG is what a new user downloads. Both need to be notarized,
          # but only the DMG and the .app can be stapled — a zip cannot
          # hold a stapled ticket, so the app is stapled before zipping.
          submit "${{ steps.art.outputs.appzip }}"
          xcrun stapler staple dist/*.app
          submit "${{ steps.art.outputs.dmg }}"
          xcrun stapler staple "${{ steps.art.outputs.dmg }}"
          rm -f "$RUNNER_TEMP/key.p8"
          # Repackage so the shipped archives contain the stapled app.
          bash build/repackage.sh
          echo "→ Gatekeeper verdict on the DMG:"
          spctl -a -t open --context context:primary-signature -vv "${{ steps.art.outputs.dmg }}"
          echo "→ and on the app:"
          spctl -a -t exec -vv dist/*.app
      # The DMG and app-zip names follow XL_DMG_NAME, so hardcoding them
      # here breaks the release the moment the product is renamed — which
      # is exactly what happened going from XL.dmg to CobAlt.dmg. Resolve
      # them from disk instead, and fail loudly if they are missing.
      - name: Locate the built artifacts
        id: art
        run: |
          set -eu
          DMG=$(ls dist/*.dmg | head -1)
          APPZIP=$(ls dist/*-App.zip | head -1)
          UPDATE=$(ls dist/*-update.zip | head -1)
          for f in "$DMG" "$APPZIP" "$UPDATE"; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
            echo "   $f ($(stat -f%z "$f") bytes)"
          done
          {
            echo "dmg=$DMG"
            echo "appzip=$APPZIP"
            echo "update=$UPDATE"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update release with DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --title "CobAlt $TAG" \
            --notes "Download the DMG below → drag CobAlt to Applications → open (first time: System Settings → Privacy & Security → Open Anyway) → grant Accessibility → tap ⌥ in Excel, PowerPoint or Word." \
            2>/dev/null || true
          gh release upload "$TAG" "${{ steps.art.outputs.dmg }}" \
            "${{ steps.art.outputs.appzip }}" "${{ steps.art.outputs.update }}" --clobber
      - name: Publish appcast for in-app updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          # Public repo: the key lives ONLY in the SPARKLE_PRIVATE_KEY secret.
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY secret missing — skipping appcast (in-app updates will not see this release)"
            exit 0
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/sk.pem
          KEYFILE=/tmp/sk.pem
          VER="${TAG#v}"
          BUILD="${{ github.run_number }}"
          SIG=$(openssl pkeyutl -sign -inkey "$KEYFILE" -rawin -in "${{ steps.art.outputs.update }}" | base64)
          LEN=$(stat -f%z "${{ steps.art.outputs.update }}")
          # Read the floor off the built app rather than hardcoding it. It
          # was pinned at 12.0 here while the runtime required 13.0, so
          # Sparkle offered updates to machines that could not run them.
          BUILT_APP=$(ls -d dist/*.app | head -1)
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" \
                    "$BUILT_APP/Contents/Info.plist")
          test -n "$MINOS"
          cat > appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
          <channel><title>⌥XL</title>
          <item>
          <title>Version $VER</title>
          <sparkle:version>$BUILD</sparkle:version>
          <sparkle:shortVersionString>$VER</sparkle:shortVersionString>
          <sparkle:minimumSystemVersion>$MINOS</sparkle:minimumSystemVersion>
          <enclosure url="https://github.com/continental-vito/xlalt/releases/download/$TAG/$(basename "${{ steps.art.outputs.update }}")" length="$LEN" type="application/octet-stream" sparkle:edSignature="$SIG"/>
          </item>
          </channel></rss>
          APPCAST
          sed -i '' 's/^          //' appcast.xml
          git config user.name "xl-ci" ; git config user.email "ci@corgianalyst.dev"
          git add appcast.xml
          git commit -m "appcast $TAG [skip ci]" || exit 0
          git push origin HEAD:main
