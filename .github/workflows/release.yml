name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. v1.4)'
        required: true
permissions:
  contents: write
jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Tests run on every push in the ubuntu 'tests' workflow; this job
      # only builds and ships. (A brew/lua install here proved brittle on
      # the macOS runner and failed the v1.4.1 build.)
      - name: Build, sign, and package DMG
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          export XL_VERSION="${TAG#v}"
          export XL_BUILD="${{ github.run_number }}"
          bash build/build-app.sh
      - name: Create or update release with DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --title "CobAlt $TAG" \
            --notes "Download XL.dmg below → drag CobAlt to Applications → open (first time: System Settings → Privacy & Security → Open Anyway) → grant Accessibility → tap ⌥ in Excel, PowerPoint or Word." \
            2>/dev/null || true
          gh release upload "$TAG" dist/XL.dmg dist/XL-App.zip dist/ExcelAlt-update.zip --clobber
      - name: Publish appcast for in-app updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          # Public repo: the key lives ONLY in the SPARKLE_PRIVATE_KEY secret.
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY secret missing — skipping appcast (in-app updates will not see this release)"
            exit 0
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/sk.pem
          KEYFILE=/tmp/sk.pem
          VER="${TAG#v}"
          BUILD="${{ github.run_number }}"
          SIG=$(openssl pkeyutl -sign -inkey "$KEYFILE" -rawin -in dist/ExcelAlt-update.zip | base64)
          LEN=$(stat -f%z dist/ExcelAlt-update.zip)
          cat > appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
          <channel><title>⌥XL</title>
          <item>
          <title>Version $VER</title>
          <sparkle:version>$BUILD</sparkle:version>
          <sparkle:shortVersionString>$VER</sparkle:shortVersionString>
          <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>
          <enclosure url="https://github.com/continental-vito/xlalt/releases/download/$TAG/ExcelAlt-update.zip" length="$LEN" type="application/octet-stream" sparkle:edSignature="$SIG"/>
          </item>
          </channel></rss>
          APPCAST
          sed -i '' 's/^          //' appcast.xml
          git config user.name "xl-ci" ; git config user.email "ci@corgianalyst.dev"
          git add appcast.xml
          git commit -m "appcast $TAG [skip ci]" || exit 0
          git push origin HEAD:main
