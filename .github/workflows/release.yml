name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. v1.4)'
        required: true
permissions:
  contents: write
jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Tests run on every push in the ubuntu 'tests' workflow; this job
      # only builds and ships. (A brew/lua install here proved brittle on
      # the macOS runner and failed the v1.4.1 build.)
      - name: Build, sign, and package DMG
        run: bash build/build-app.sh
      - name: Create or update release with DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --title "⌥XL $TAG" \
            --notes "Download XL.dmg below → drag ExcelAlt to Applications → open (first time: System Settings → Privacy & Security → Open Anyway) → grant Accessibility → tap ⌥ in Excel." \
            2>/dev/null || true
          gh release upload "$TAG" dist/XL.dmg dist/XL-App.zip --clobber
