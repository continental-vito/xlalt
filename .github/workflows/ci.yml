name: tests
on:
  push:
  pull_request:
jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: luac5.4 -p src/init.lua tests/hs_mock.lua tests/run_tests.lua
      - name: Run test suite
        run: lua5.4 tests/run_tests.lua

  # The Shortcut Manager is ~400 lines of JS embedded in init.lua, driving
  # three per-host pages. jsdom loads that exact markup and exercises the
  # tabs, theming, forms, and the messages the engine would receive, which
  # the Lua suite cannot see.
  # The app menu, About/Hide/Quit and the window titles live in compiled
  # nibs. Editing them wrong is either an app that will not start or an
  # app with dead menu items, and neither is visible to the Lua suite.
  # The Lua suite checks the swap script's TEXT. This runs it, against real
  # directories, and checks what is left on disk — including the paths
  # where the update fails and the installed app has to survive.
  update-swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - run: bash tests/swap_test.sh
      - run: bash tests/readme_test.sh

  # The build rewrites setup.lua so the engine finds its config inside the
  # bundle. The first version of that patch was inert and nothing noticed
  # for two releases, so this runs the patched file and checks what it
  # actually forwards to the runtime.
  config-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - run: bash tests/setup_patch_test.sh

  nib-rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nib rename is lossless and spares selectors
        run: bash build/verify-nib-rename.sh

  # In-place updates hinge on one property of the signature: a new build
  # must satisfy the installed build's designated requirement. It is
  # invisible to `codesign --verify`, and getting it wrong shows up only
  # as an update that will not install. Proven here on every push, both
  # directions, in a few seconds.
  signing-requirement:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build signature validation
        run: bash build/verify-signing.sh

  manager-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install jsdom
        run: npm ci --prefix tests/ui || npm install --prefix tests/ui
      - name: Run manager UI checks
        run: node tests/ui/check.js
