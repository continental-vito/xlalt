name: verify in-place update
# Builds the real app twice, as two consecutive releases, and checks
# whether the second would be allowed to replace the first.
#
# build/verify-signing.sh proves the signing technique on a minimal
# bundle in seconds on every push. This proves it on the actual product,
# with the nested Sparkle framework, XPC services and the compiled
# launcher in place — the parts a minimal bundle cannot represent.
#
# Every check is its own step, deliberately. GitHub serves job logs from
# a storage host that is not always reachable, and when it isn't, the
# step name is the only diagnosis available. Keep them granular.
#
# Publishes nothing. Manual dispatch only; run it before tagging a
# release that changes anything about signing.
on:
  workflow_dispatch:
  # Also runs on a scratch branch, so it can be exercised without first
  # putting the workflow on main.
  push:
    branches: ['verify/**']

jobs:
  cross-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build "old" release
        env:
          XL_APP_ONLY: "1"
          XL_VERSION: "9.0"
        run: |
          bash build/build-app.sh
          mv dist/ExcelAlt.app "$RUNNER_TEMP/old.app"

      - name: Build "new" release
        env:
          XL_APP_ONLY: "1"
          XL_VERSION: "9.1"
        run: |
          # Change the payload, so the two builds differ the way real
          # consecutive releases do rather than being reproducible copies.
          printf '\n-- verify-update: forces a different code hash\n' >> src/init.lua
          bash build/build-app.sh
          mv dist/ExcelAlt.app "$RUNNER_TEMP/new.app"

      - name: check - both bundles are the real product
        run: |
          set -eu
          for A in "$RUNNER_TEMP/old.app" "$RUNNER_TEMP/new.app"; do
            test -x "$A/Contents/MacOS/Hammerspoon"
            grep -q "config lives in this bundle" "$A/Contents/Resources/setup.lua"
            test -f "$A/Contents/Resources/init.lua"
            test -d "$A/Contents/Frameworks/Sparkle.framework"
            SIZE=$(du -sm "$A" | cut -f1)
            echo "$A is ${SIZE}MB"
            test "$SIZE" -ge 30
          done

      - name: check - the two builds are different releases
        run: |
          set -eu
          OV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                 "$RUNNER_TEMP/old.app/Contents/Info.plist")
          NV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                 "$RUNNER_TEMP/new.app/Contents/Info.plist")
          echo "old=$OV new=$NV"
          test "$OV" = "9.0"
          test "$NV" = "9.1"
          if cmp -s "$RUNNER_TEMP/old.app/Contents/Resources/init.lua" \
                    "$RUNNER_TEMP/new.app/Contents/Resources/init.lua"; then
            echo "identical payloads; the comparison below would be vacuous" >&2
            exit 1
          fi

      - name: check - neither carries a build-specific requirement
        run: |
          set -eu
          for A in "$RUNNER_TEMP/old.app" "$RUNNER_TEMP/new.app"; do
            DR=$(codesign -d -r- "$A" 2>&1 | grep '^designated' || true)
            echo "$A: $DR"
            test -n "$DR"
            case "$DR" in
              *cdhash*) echo "requirement is pinned to one build" >&2; exit 1 ;;
            esac
            case "$DR" in
              *'identifier "com.corgianalyst.excel-alt-shortcuts"'*) ;;
              *) echo "unexpected requirement" >&2; exit 1 ;;
            esac
          done

      - name: build the requirement checker
        run: |
          set -eu
          clang -O2 -o "$RUNNER_TEMP/drcheck" build/drcheck.c \
            -framework CoreFoundation -framework Security
          test -x "$RUNNER_TEMP/drcheck"

      # If this step passes, everything after it is meaningless: it would
      # mean the checker succeeds regardless of what it is given.
      - name: control - the same builds signed the old way must be REJECTED
        run: |
          set -eu
          cp -R "$RUNNER_TEMP/old.app" "$RUNNER_TEMP/ctl-old.app"
          cp -R "$RUNNER_TEMP/new.app" "$RUNNER_TEMP/ctl-new.app"
          codesign --force --deep --sign - "$RUNNER_TEMP/ctl-old.app"
          codesign --force --deep --sign - "$RUNNER_TEMP/ctl-new.app"
          if "$RUNNER_TEMP/drcheck" "$RUNNER_TEMP/ctl-old.app" "$RUNNER_TEMP/ctl-new.app"; then
            echo "plain ad-hoc signing passed - the checker measures nothing" >&2
            exit 1
          fi
          echo "rejected, as it has been since v3.2"

      - name: check - the real update would install
        run: '"$RUNNER_TEMP/drcheck" "$RUNNER_TEMP/old.app" "$RUNNER_TEMP/new.app"'

      - name: check - and in the reverse direction
        run: '"$RUNNER_TEMP/drcheck" "$RUNNER_TEMP/new.app" "$RUNNER_TEMP/old.app"'

      - name: check - nested code survived the re-seal
        run: |
          # The top level is re-signed without --deep to keep the explicit
          # requirement off the nested Sparkle framework. Confirm that did
          # not leave anything inside unsealed.
          set -eu
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/new.app"
          codesign --verify --strict \
            "$RUNNER_TEMP/new.app/Contents/Frameworks/Sparkle.framework"
