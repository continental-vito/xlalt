name: verify in-place update
# Builds the real app twice, as two consecutive releases, and checks
# whether the second would be allowed to replace the first.
#
# build/verify-signing.sh proves the signing technique on a minimal
# bundle in seconds on every push. This proves it on the actual product,
# with the nested Sparkle framework, XPC services and the compiled
# launcher in place — the parts a minimal bundle cannot represent.
#
# Publishes nothing. Manual dispatch only; run it before tagging a
# release that changes anything about signing.
on:
  workflow_dispatch:
  # Also runs on a scratch branch, so it can be exercised without first
  # putting the workflow on main.
  push:
    branches: ['verify/**']

jobs:
  cross-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build "old" release
        env:
          XL_APP_ONLY: "1"
          XL_VERSION: "9.0"
        run: |
          bash build/build-app.sh
          mv dist/ExcelAlt.app "$RUNNER_TEMP/old.app"

      - name: Build "new" release
        env:
          XL_APP_ONLY: "1"
          XL_VERSION: "9.1"
        run: |
          # Change the payload, so the two builds differ the way real
          # consecutive releases do rather than being reproducible copies.
          printf '\n-- verify-update: forces a different code hash\n' >> src/init.lua
          bash build/build-app.sh
          mv dist/ExcelAlt.app "$RUNNER_TEMP/new.app"

      # Everything here asserts. A printed result is worth nothing if the
      # only thing anyone checks afterwards is whether the tick was green.
      - name: Would the update install?
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/old.app" ; NEW="$RUNNER_TEMP/new.app"

          echo "→ both bundles are the real product, not an empty directory"
          test -x "$OLD/Contents/MacOS/ExcelAltCore"
          test -x "$NEW/Contents/MacOS/ExcelAltCore"
          test -x "$NEW/Contents/MacOS/ExcelAlt"
          test -d "$NEW/Contents/Frameworks/Sparkle.framework"
          SIZE=$(du -sm "$NEW" | cut -f1)
          echo "   new.app is ${SIZE}MB"
          test "$SIZE" -ge 30

          echo "→ the two builds genuinely differ"
          OH=$(codesign -d -vv "$OLD" 2>&1 | awk -F= '/^CDHash/{print $2}')
          NH=$(codesign -d -vv "$NEW" 2>&1 | awk -F= '/^CDHash/{print $2}')
          echo "   old CDHash=$OH"
          echo "   new CDHash=$NH"
          test -n "$OH" ; test -n "$NH" ; test "$OH" != "$NH"

          echo "→ neither carries a build-specific requirement"
          for A in "$OLD" "$NEW"; do
            DR=$(codesign -d -r- "$A" 2>&1 | grep '^designated')
            echo "   $DR"
            echo "$DR" | grep -q 'identifier'
            echo "$DR" | grep -qv 'cdhash'
          done

          clang -O2 -o "$RUNNER_TEMP/drcheck" build/drcheck.c \
            -framework CoreFoundation -framework Security

          echo "→ control: the same two builds, signed the old way, must be REJECTED"
          cp -R "$OLD" "$RUNNER_TEMP/ctl-old.app"
          cp -R "$NEW" "$RUNNER_TEMP/ctl-new.app"
          codesign --force --deep --sign - "$RUNNER_TEMP/ctl-old.app"
          codesign --force --deep --sign - "$RUNNER_TEMP/ctl-new.app"
          if "$RUNNER_TEMP/drcheck" "$RUNNER_TEMP/ctl-old.app" "$RUNNER_TEMP/ctl-new.app"; then
            echo "✗ plain ad-hoc signing passed — the checker is not measuring anything" >&2
            exit 1
          fi
          echo "   ✓ rejected, so the check below means something"

          echo "→ Sparkle's check, on the real bundles"
          "$RUNNER_TEMP/drcheck" "$OLD" "$NEW"
          echo "→ and the reverse, so it is not an accident of ordering"
          "$RUNNER_TEMP/drcheck" "$NEW" "$OLD"

      - name: Nested code survived the re-seal
        run: |
          # The top level is re-signed without --deep to keep the explicit
          # requirement off the nested Sparkle framework. Confirm that did
          # not leave anything inside unsealed.
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/new.app"
          codesign --verify --strict \
            "$RUNNER_TEMP/new.app/Contents/Frameworks/Sparkle.framework"
